# ==============================================================================
# Nginx Reverse Proxy Configuration for Jonak Hotel & Restaurant
# Domains: jonakhotelgroup.in | www.jonakhotelgroup.in
# Upstream: Node.js Express Server (http://127.0.0.1:5000)
# ==============================================================================

# Rate limiting zone for protection against brute-force
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;

server {
    listen 80;
    listen [::]:80;
    server_name jonakhotelgroup.in www.jonakhotelgroup.in;

    # Root directory for Let's Encrypt Certbot challenge verification
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
    }

    # Gzip Compression Optimization
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/rss+xml
        image/svg+xml;

    # Client Request Limits
    client_max_body_size 20M;
    client_body_timeout 30s;
    client_header_timeout 30s;

    # Security Headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(self), microphone=()" always;

    # --------------------------------------------------------------------------
    # 1. Real-Time Server-Sent Events (SSE) Route (/api/events)
    # CRITICAL: Buffering must be disabled and timeouts set to 24h for live sync
    # --------------------------------------------------------------------------
    location /api/events {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;

        # Disable all buffering so client receives instant sub-second notifications
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Connection '';
        chunked_transfer_encoding off;

        # Keep connection open for continuous live updates
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;

        # Standard Proxy Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --------------------------------------------------------------------------
    # 2. REST API Endpoints (/api/)
    # --------------------------------------------------------------------------
    location /api/ {
        limit_req zone=api_limit burst=20 nodelay;

        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;

        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # --------------------------------------------------------------------------
    # 3. Static Hashed Assets Caching (/assets/)
    # --------------------------------------------------------------------------
    location /assets/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;

        # Cache immutable bundle chunks for 1 year
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # --------------------------------------------------------------------------
    # 4. Main Application & SPA Client-Side Routing
    # --------------------------------------------------------------------------
    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;

        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Disable cache for index.html to ensure users always receive latest version
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}
